services:
  api:
    build:
      context: ./media8-api
      dockerfile: Dockerfile
    container_name: media8_workstation_api
    restart: unless-stopped
    environment:
      - ConnectionStrings__PostgreSQL=${DB_CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@media8.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-SenhaAdminSegura123!}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-S3cur3S3cr3tKeyM3dia8Workstati0n2026!Min32Chars}
      - JWT_ISSUER=${JWT_ISSUER:-Media8Workstation}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-Media8WorkstationUsers}
      - CORS_RESTRICTED=${CORS_RESTRICTED:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - media_storage:/storage

  worker-ingestion:
    build:
      context: .
      dockerfile: ./media8-workers/Dockerfile.workers
      args:
        WORKER_PROJECT: Media8.Workstation.Worker.Ingestion
    container_name: media8_workstation_worker_ingestion
    restart: unless-stopped
    environment:
      - ConnectionStrings__PostgreSQL=${DB_CONNECTION_STRING}
      - WORKER_ID=ingestion-worker-1
    volumes:
      - media_storage:/storage

  worker-transcoder:
    build:
      context: .
      dockerfile: ./media8-workers/Dockerfile.workers
      args:
        WORKER_PROJECT: Media8.Workstation.Worker.Transcoder
    container_name: media8_workstation_worker_transcoder
    restart: unless-stopped
    environment:
      - ConnectionStrings__PostgreSQL=${DB_CONNECTION_STRING}
      - WORKER_ID=transcoder-worker-1
    volumes:
      - media_storage:/storage

  web:
    build:
      context: ./media8-web
      dockerfile: Dockerfile
    container_name: media8_workstation_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  media_storage:
